<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1727"/>
      <stop offset="100%" style="stop-color:#040b15"/>
    </linearGradient>
    <radialGradient id="circleGradient" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" style="stop-color:#7dd3ff"/>
      <stop offset="50%" style="stop-color:#5bc0ff"/>
      <stop offset="100%" style="stop-color:#2878cc"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="6" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Fond arrondi -->
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" fill="url(#bgGradient)"/>
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" 
        fill="none" stroke="#5bc0ff" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Cercle principal avec gradient -->
  <g filter="url(#dropShadow)">
    <circle cx="512" cy="512" r="320" fill="url(#circleGradient)" filter="url(#innerShadow)"/>
  </g>
  
  <!-- Reflet en haut -->
  <ellipse cx="440" cy="350" rx="120" ry="60" fill="#ffffff" fill-opacity="0.2"/>
  
  <!-- Triangle Play -->
  <path d="M440 380 L440 644 L660 512 Z" fill="#ffffff" fill-opacity="0.95"/>
</svg>
