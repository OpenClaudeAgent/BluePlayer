<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1727"/>
      <stop offset="100%" style="stop-color:#040b15"/>
    </linearGradient>
    <linearGradient id="bGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3ff"/>
      <stop offset="50%" style="stop-color:#5bc0ff"/>
      <stop offset="100%" style="stop-color:#3da2ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Fond arrondi -->
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" fill="url(#bgGradient)"/>
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" 
        fill="none" stroke="#5bc0ff" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Lettre B stylisée avec triangles Play -->
  <g filter="url(#dropShadow)">
    <!-- Barre verticale du B -->
    <rect x="280" y="200" width="100" height="624" rx="20" fill="url(#bGradient)"/>
    
    <!-- Partie haute du B (avec triangle play) -->
    <path d="M380 200 
             L380 480 
             L580 340
             C650 300 650 240 580 200
             Z" 
          fill="url(#bGradient)"/>
    
    <!-- Partie basse du B (avec triangle play) -->
    <path d="M380 544 
             L380 824 
             L600 824
             C680 824 680 700 600 660
             L380 544
             Z" 
          fill="url(#bGradient)"/>
    
    <!-- Triangle Play haute -->
    <path d="M420 280 L420 400 L530 340 Z" fill="#ffffff" fill-opacity="0.9"/>
    
    <!-- Triangle Play basse -->
    <path d="M420 600 L420 740 L550 670 Z" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
