<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1727"/>
      <stop offset="100%" style="stop-color:#040b15"/>
    </linearGradient>
    
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5bc0ff"/>
      <stop offset="60%" style="stop-color:#3da2ff"/>
      <stop offset="100%" style="stop-color:#2878cc"/>
    </linearGradient>
    
    <!-- Reflet subtil qui suit la courbe de la goutte -->
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e4ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#5bc0ff;stop-opacity:0"/>
    </linearGradient>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Flou pour le reflet -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    
    <!-- Clip pour contenir le reflet dans la goutte -->
    <clipPath id="dropClip">
      <path d="M512 180
               C512 180 300 420 300 580
               C300 700 395 820 512 820
               C629 820 724 700 724 580
               C724 420 512 180 512 180Z"/>
    </clipPath>
  </defs>
  
  <!-- Fond arrondi style macOS Big Sur -->
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" fill="url(#bgGradient)"/>
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" 
        fill="none" stroke="#5bc0ff" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Goutte d'eau principale -->
  <g filter="url(#dropShadow)">
    <path d="M512 180
             C512 180 300 420 300 580
             C300 700 395 820 512 820
             C629 820 724 700 724 580
             C724 420 512 180 512 180Z" 
          fill="url(#dropGradient)"/>
  </g>
  
  <!-- Reflet intégré à la goutte (clippé) -->
  <g clip-path="url(#dropClip)">
    <!-- Reflet courbe qui suit le bord gauche -->
    <path d="M512 200
             C480 280 360 400 340 520
             C340 440 420 300 512 200Z" 
          fill="url(#innerHighlight)" 
          filter="url(#softBlur)"/>
    
    <!-- Petit point de lumière spéculaire en haut -->
    <ellipse cx="480" cy="320" rx="25" ry="40" fill="#ffffff" fill-opacity="0.25" filter="url(#softBlur)"/>
  </g>
  
  <!-- Triangle Play -->
  <path d="M460 470 L460 630 L610 550 Z" fill="#ffffff" fill-opacity="0.95"/>
</svg>
